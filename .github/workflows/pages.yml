name: Deploy website preview
on:
  push:
    branches: [main]
    paths: ['web/**', 'locales.ts', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          PKT_LINKEDIN_PREVIEW: 'true'
      - name: Verify preview feed embeds
        run: node scripts/verify-feed.mjs --preview --build-only
        working-directory: web
      - name: Prepare project URLs and verify output
        run: node scripts/pages.mjs
        working-directory: web
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
